name: Optimize news images

on:
  workflow_dispatch:
    inputs:
      html_path:
        description: "HTML file path"
        required: true
        default: "index.html"
      assets_dir:
        description: "Image assets directory"
        required: true
        default: "assets"
      quality_offset:
        description: "WebP quality offset, e.g. -5"
        required: true
        default: "0"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Optimize images and update HTML
        run: |
          python optimize_images.py \
            --html "${{ inputs.html_path }}" \
            --assets "${{ inputs.assets_dir }}" \
            --quality-offset "${{ inputs.quality_offset }}" \
            --in-place
          rm -f "${{ inputs.html_path }}.bak"

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.html_path }}" "${{ inputs.assets_dir }}"/*.webp

          if git diff --cached --quiet; then
            echo "No optimization changes to commit."
          else
            git commit -m "Optimize news page images"
            git push
          fi
